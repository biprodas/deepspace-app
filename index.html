<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="arena">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>StudyArena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html { background-color: #0a0a0a; color-scheme: dark; }
      html[data-theme="paper"] { background-color: #ffffff; color-scheme: light; }
      html[data-theme="arena"] { background-color: #fbfaf7; color-scheme: light; }
      html[data-theme="arena"][data-mode="dark"] { background-color: #0f0f1e; color-scheme: dark; }
      /* Add one line per theme you create, mirroring its --color-background. */
    </style>
    <!--
      Light / dark mode, resolved before first paint so a dark page never
      flashes light: the visitor's saved choice, else the OS setting (followed
      live while there is no saved choice). Mirrors src/lib/color-mode.ts;
      keep the storage key and attribute in sync.
    -->
    <script>
      (function () {
        var key = 'studyarena:color-mode'
        var root = document.documentElement
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        function saved() {
          try {
            var v = localStorage.getItem(key)
            return v === 'light' || v === 'dark' ? v : null
          } catch (e) {
            return null
          }
        }
        root.dataset.mode = saved() || (media.matches ? 'dark' : 'light')
        media.addEventListener('change', function (e) {
          if (!saved()) root.dataset.mode = e.matches ? 'dark' : 'light'
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
